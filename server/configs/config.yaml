deployment:
  profile: lite                 # lite | standard
  mode: singleNode              # singleNode | cluster
  services: monolith            # monolith | microservice

server:
  http_addr: ":8080"
  ws_addr: ":8081"
  mode: release

db:
  driver: mysql
  message_driver: mysql         # lite: 消息与元数据同库；standard: scylla
  dsn: "root:nexim123@tcp(mysql:3306)/nexim?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 20
  max_idle_conns: 5
  shards: 1                     # standard: 16
  replicas: 1                   # standard: 1 master + N replicas
  messageSharedInstance: true

redis:
  addr: "redis:6379"
  password: ""
  db: 0
  cluster: false                # standard: true

cache:
  driver: redis
  cluster: false
  aof: true

mq:
  driver: nats                  # standard: kafka
  stream: im-event
  replicas: 1
  retention: 7d

search:
  driver: meilisearch
  replicas: 1                   # standard: 3
  url: ""
  api_key: ""

storage:
  driver: localFS               # standard: rustfs（S3 兼容，替代 MinIO）
  local_dir: "data/files"
  bucket: ""

observability:
  metrics: victoriametrics      # standard: prometheus
  tracingSample: 0.1
  jaeger: false
  elk: false

rtc:
  sfuNodes: 1
  clusterEnabled: false
  stunServers: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"]

auth:
  jwt_secret: "nexim-dev-secret-change-in-production"
  access_token_ttl: 7200s
  refresh_token_ttl: 604800s
  verify_code_ttl: 300s

message:
  history_limit: 200
  retention_days: 90

log:
  level: info
  encoding: json
