services:
  mysql:
    image: mysql:8.0.36
    container_name: nexim-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nexim123
      MYSQL_DATABASE: nexim
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pnexim123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: nexim-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # NATS JetStream：消息队列 / 事件总线（消息落库后发布事件，跨节点实时投递）
  nats:
    image: nats:2.10-alpine
    container_name: nexim-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RustFS：S3 兼容对象存储，统一存放聊天文件、头像、语音等
  rustfs:
    image: rustfs/rustfs:latest
    container_name: nexim-rustfs
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: "nexim"
      RUSTFS_SECRET_KEY: "nexim123456"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # coturn：自建 STUN/TURN 音视频中继（跨 NAT、移动网络通话必需）
  # 跨设备/公网部署必须在 server/.env 中设置 TURN_EXTERNAL_IP 为客户端可达的
  # 宿主内网 IP 或公网 IP/域名，并放行 3478/udp、3478/tcp 与 49160-49200/udp；
  # 未设置时仅回环地址可用，模拟器与其他设备无法通过 TURN 中继。
  coturn:
    image: coturn/coturn:4.6.2
    container_name: nexim-coturn
    restart: unless-stopped
    command:
      - "-n"
      - "--lt-cred-mech"
      - "--fingerprint"
      - "--realm=${TURN_REALM:-nex.im}"
      - "--user=${TURN_USER:-nexim}:${TURN_PASS:-nexim123}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}"
      - "--no-cli"
      - "--no-multicast-peers"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  # 单二进制：Go API + WebSocket + Vue Admin（前端已 embed 进二进制）
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: nexim-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DB_DSN: "root:nexim123@tcp(mysql:3306)/nexim?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      AUTH_JWT_SECRET: "nexim-dev-secret-change-in-production"
      SERVER_HTTP_ADDR: ":8080"
      SERVER_WS_ADDR: ":8081"
      LOG_LEVEL: "info"
      # 消息队列：NATS JetStream（事件持久化、可回放、跨网关节点投递）
      MQ_DRIVER: "jetstream"
      MQ_URL: "nats://nats:4222"
      MQ_STREAM: "IM_EVENT"
      MQ_RETENTION: "7d"
      # 对象存储：统一走 RustFS（S3 兼容），不再使用本地磁盘
      STORAGE_DRIVER: "rustfs"
      STORAGE_BUCKET: "nexim-files"
      STORAGE_ENDPOINT: "http://rustfs:9000"
      STORAGE_ACCESS_KEY: "nexim"
      STORAGE_SECRET_KEY: "nexim123456"
      STORAGE_REGION: "us-east-1"
      # 实时音视频：自建 coturn（STUN/TURN），不再依赖公网 STUN
      # 跨设备/公网部署只需设置 TURN_EXTERNAL_IP（宿主内网 IP 或公网 IP/域名），
      # STUN/TURN 地址自动跟随；服务端也会把回环地址改写成客户端实际访问的主机
      STUN_SERVERS: "${STUN_SERVERS:-stun:${TURN_EXTERNAL_IP:-127.0.0.1}:3478}"
      RTC_COTURNADDR: "coturn:3478"
      RTC_TURNURL: "${TURN_URL:-turn:${TURN_EXTERNAL_IP:-127.0.0.1}:3478?transport=udp}"
      RTC_TURNUSERNAME: "${TURN_USER:-nexim}"
      RTC_TURNPASSWORD: "${TURN_PASS:-nexim123}"
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  mysql-data:
  redis-data:
  rustfs-data:
  nats-data:
